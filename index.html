<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>AquaFlow — Consultor Aquarista</title>

<meta name="description" content="Diário técnico e consultor do seu aquário plantado: parâmetros, ciclagem, TPA, dosagens, fauna, plantas e alertas.">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AquaFlow">

<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div id="splash" class="splash">
  <img src="./icons/icon-192.png" alt="" width="72" height="72">
  <div class="splash-name">AquaFlow</div>
  <div class="splash-sub">carregando…</div>
</div>

<header id="topbar" class="topbar" hidden>
  <button class="tb-btn" id="tb-back" aria-label="Voltar" hidden>
    <svg viewBox="0 0 24 24" class="ic"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="tb-title" id="tb-title">AquaFlow</div>
  <div class="tb-actions" id="tb-actions"></div>
</header>

<main id="view" class="view" hidden></main>

<nav id="tabbar" class="tabbar" hidden>
  <button class="tab" data-route="parametros">
    <svg viewBox="0 0 24 24" class="ic"><path d="M9 3h6M10 3v6.2L5.5 17.4A2.5 2.5 0 0 0 7.7 21h8.6a2.5 2.5 0 0 0 2.2-3.6L14 9.2V3"/></svg>
    <span>Parâmetros</span>
  </button>
  <button class="tab" data-route="tarefas">
    <svg viewBox="0 0 24 24" class="ic"><path d="M8 4h8a2 2 0 0 1 2 2v14H6V6a2 2 0 0 1 2-2zM9 3h6v3H9zM9 12l2 2 4-4"/></svg>
    <span>Tarefas</span>
  </button>
  <button class="tab" data-route="aquario">
    <svg viewBox="0 0 24 24" class="ic"><path d="M4 8h16v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8zM8 8V6a4 4 0 0 1 8 0v2M9 14h4"/></svg>
    <span>Aquário</span>
  </button>
  <button class="tab" data-route="fauna">
    <svg viewBox="0 0 24 24" class="ic"><path d="M3 12c4-6 12-6 16 0-4 6-12 6-16 0zM19 12l2-3v6l-2-3zM8 11h.01"/></svg>
    <span>Fauna</span>
  </button>
  <button class="tab" data-route="ajustes">
    <svg viewBox="0 0 24 24" class="ic"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6 2 2 0 1 1 14 4.6a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4z"/></svg>
    <span>Ajustes</span>
  </button>
</nav>

<button id="fab" class="fab" aria-label="Registrar rápido" hidden>
  <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script type="module" src="./js/app.js"></script>
<noscript><p style="padding:24px;color:#fff">Este aplicativo precisa de JavaScript habilitado.</p></noscript>
</body>
</html>
